name: Catalog checks

on:
  push:
    branches: [ develop, 'feature/**', 'project/**' ]
  pull_request:
    branches: [ develop, master ]
  workflow_dispatch:

jobs:
  lint:
    name: Catalog lint (no CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: check-all without sandbox
        run: skills/judo-catalog-maintain/scripts/check-all --no-sandbox

  kb:
    name: kb compatibility (consumer index, dox, search quality)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # pinned: the version consumers are expected to run; latest: catches kb releases that break the catalog
        kb: [ '0.11.0', 'latest' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install kb CLI ${{ matrix.kb }}
        run: npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/kb" "@blackbelt-technology/pi-dashboard-kb@${{ matrix.kb }}"
      - name: kb gates (kb-dox-lint, kb-index, kb-eval)
        run: |
          export KB_CLI="$RUNNER_TEMP/kb/node_modules/@blackbelt-technology/pi-dashboard-kb/dist/cli.js"
          node "$KB_CLI" --help | head -1
          skills/judo-catalog-maintain/scripts/check-all --no-sandbox --require-kb --json | tee "$RUNNER_TEMP/check.txt"
          python3 -c "import json,sys; r=json.loads(open(sys.argv[1]).read().strip().splitlines()[-1]); bad=[k for k in ('kb-dox-lint','kb-index','kb-eval') if r.get(k)!='pass']; sys.exit('kb gates not passing: %s' % bad if bad else 0)" "$RUNNER_TEMP/check.txt"

  sandbox:
    name: Fragments (sandbox)
    runs-on: judong
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup maven settings.xml
        uses: whelk-io/maven-settings-xml-action@v20
        with:
          servers: >
            [
                {
                    "id": "judo-ng",
                    "username": "${{ secrets.JUDONG_NEXUS_USERNAME }}",
                    "password": "${{ secrets.JUDONG_NEXUS_PASSWORD }}"
                }
            ]

      - name: Download pinned judo-cli to target/
        run: ./mvnw validate -P download-model-cli --batch-mode --no-transfer-progress
        env:
          MAVEN_OPTS: "-Xmx512m"

      - name: Fragments check (strict validate + diagram equals fresh render)
        run: skills/judo-model-mermaid/scripts/check --all
        env:
          JAVA_TOOL_OPTIONS: "-Xmx512m -XX:+UseSerialGC"
