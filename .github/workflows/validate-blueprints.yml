name: Catalog checks

on:
  push:
    branches: [ develop, 'feature/**', 'project/**' ]
  pull_request:
    branches: [ develop, master ]
  workflow_dispatch:

jobs:
  lint:
    name: Catalog lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: check-all
        run: skills/judo-catalog-maintain/scripts/check-all

  kb:
    name: kb compatibility (consumer index, dox, search quality)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # pinned: the version consumers are expected to run; latest: catches kb releases that break the catalog
        kb: [ '0.11.0', 'latest' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install kb CLI ${{ matrix.kb }}
        run: npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/kb" "@blackbelt-technology/pi-dashboard-kb@${{ matrix.kb }}"
      - name: kb gates (kb-dox-lint, kb-index, kb-eval)
        run: |
          export KB_CLI="$RUNNER_TEMP/kb/node_modules/@blackbelt-technology/pi-dashboard-kb/dist/cli.js"
          node "$KB_CLI" --help | head -1
          skills/judo-catalog-maintain/scripts/check-all --require-kb --json | tee "$RUNNER_TEMP/check.txt"
          python3 -c "import json,sys; r=json.loads(open(sys.argv[1]).read().strip().splitlines()[-1]); bad=[k for k in ('kb-dox-lint','kb-index','kb-eval') if r.get(k)!='pass']; sys.exit('kb gates not passing: %s' % bad if bad else 0)" "$RUNNER_TEMP/check.txt"
